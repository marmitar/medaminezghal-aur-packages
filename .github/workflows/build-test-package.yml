name: PKGBUILD CI

on:
  pull_request:
    branches: [main]
    paths:
      - "*/PKGBUILD"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    permissions:
      pull-requests: write

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install base tools
        run: pacman -S --noconfirm --needed git sudo rust cargo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git config --global safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main

      - name: Find changed package
        id: pkg
        run: |
          dir=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                  -- '*/PKGBUILD' \
                | head -n1 \
                | sed 's|/PKGBUILD||')

          if [[ -z "$dir" ]]; then
            echo "No PKGBUILD changes, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ -f "$dir/PKGBUILD" ]] || { echo "::error::$dir/PKGBUILD not found"; exit 1; }

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Package to build: $dir"

      - name: Create build user
        if: steps.pkg.outputs.skip != 'true'
        run: |
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install paru
        if: steps.pkg.outputs.skip != 'true'
        run: |
          cd /tmp
          git clone --depth=1 https://aur.archlinux.org/paru.git
          chown -R builder:builder paru
          cd paru
          sudo -u builder makepkg -si --noconfirm --needed

      - name: Build & Test package
        if: steps.pkg.outputs.skip != 'true'
        run: |
          sudo -u builder paru \
            -B "$GITHUB_WORKSPACE/${{ steps.pkg.outputs.dir }}" \
            --noconfirm

      - name: Post result comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const pkg     = '${{ steps.pkg.outputs.dir }}' || 'unknown';
            const icon    = success ? '✅' : '❌';
            const status  = success ? 'Build and tests passed' : 'Build or tests failed';

            github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${icon} PKGBUILD CI — ${status}\n\n**Package:** \`${pkg}\`\n*Commit: ${{ github.sha }}*`
            });
